---
# TianBei WTR Pro: Ryzen 7 5825U, 32 GB, Ubuntu 26.04.
# Disks: 500 GB NVMe for the system, 4 TB NVMe (ext4) mounted at /srv.
# uid 1000 is `services`, the account its services run as.

accounts_services:
  - name: services
    uid: 1000
    comment: Host services

# NATS users (role nats): public nkeys. Each seed is in OpenBao at homelab/nats/<user>.
nats_users:
  admin: UAZPSPKLYBOWM7YTOIHAJRPDANJ3SXSOD2ECVJM7QTUSHYNU6DFQR4OF
  clickhousedb: UDHVLKIPCUQWDHCY7FD6DMVTGIXSAR6DCFC74FAJZKH5V4XZK6DGECQI
  trowel: UC4YVZMN4A6PMHIRCDAXURBY6GBSAULJ4DY2RBCVIGX242QKIDAVGUNE
  workspace: UBF3SZ4RN2C7T3XQY5A7ZRX24CS4HX3W3NDS2TDOUQOM7FVF27UT7ISR
  xolotl: UC7TVD54RBDAMNEFIE676CJFKP2CNSM7XHQAQJLN52OSIZPSYMHQ6DEY

# ClickHouse users (role clickhouse). Each password is in OpenBao at homelab/clickhouse/<user>, field password.
# admin manages schemas, and the Xolotl tables fed from NATS; otel is the OpenTelemetry gateway's writer; reader is
# for dashboards and agents.
clickhouse_users:
  - name: admin
    access_management: true
  - name: otel
    grants:
      - GRANT ALL ON otel.*
  - name: reader
    profile: readonly
    grants:
      - GRANT SELECT ON otel.*
      - GRANT SELECT ON xolotl.*

# Days each kind of OpenTelemetry data is kept in ClickHouse; older data is still in the B2 archive.
otel_retention_days:
  traces: 14
  logs: 30
  metrics: 30

# ClickHouse's daily archive (Parquet, kept for history) and backups (for recovery). The bucket's lifecycle rules
# hide backups/incr/ after 90 days and backups/full/ after 98, and delete hidden versions after a day.
clickhouse_b2_bucket: wyrd-clickhouse
clickhouse_b2_endpoint: https://s3.us-west-004.backblazeb2.com
