---
# TianBei WTR Pro: Ryzen 7 5825U, 32 GB, Ubuntu 26.04.
# Disks: 500 GB NVMe for the system, 4 TB NVMe (ext4) mounted at /srv.
# uid 1000 is `services`, the account its services run as.

accounts_services:
  - name: services
    uid: 1000
    comment: Host services

# NATS users (role nats) are user JWTs, each with its permissions, issued outside Ansible: admin, workspace,
# xolotl (publishes xolotl.exchanges.>), clickhouse (consumes XOLOTL), trowel (publishes github.>), deck (its own
# stream DECK and bucket deck-threads). Their .creds are in OpenBao at homelab/nats/<user>.

# Xolotl's exchanges, with request and response bodies (50-150 KB a row), wait here until ClickHouse loads them.
nats_streams:
  XOLOTL:
    subjects: ["xolotl.exchanges.>"]
    max_age_days: 7
    max_gib: 50
    max_msg_mib: 8
  # GitHub webhooks, published by Trowel as github.<owner>.<repo>.<event>.<action>.
  GITHUB:
    subjects: ["github.>"]
    max_age_days: 30
    max_gib: 10
    max_msg_mib: 8
nats_consumers:
  - { stream: XOLOTL, name: clickhouse }

# ClickHouse users (role clickhouse). Each password is in OpenBao at homelab/clickhouse/<user>, field password.
# admin manages schemas, and the Xolotl tables fed from NATS; otel is the OpenTelemetry gateway's writer; reader is
# for dashboards and agents.
clickhouse_users:
  - name: admin
    access_management: true
  - name: otel
    grants:
      - GRANT ALL ON otel.*
  - name: reader
    profile: readonly
    grants:
      - GRANT SELECT ON otel.*
      - GRANT SELECT ON xolotl.*

# Grafana (role grafana) at https://grafana.internal reads ClickHouse as reader. Pocket ID client Grafana; its groups
# grafana_admins and grafana_editors make Admins and Editors, anyone else it lets in is a Viewer.

# Days each kind of OpenTelemetry data is kept in ClickHouse; older data is still in the B2 archive.
otel_retention_days:
  traces: 14
  logs: 30
  metrics: 30

# ClickHouse's daily archive (Parquet, kept for history) and backups (for recovery). The bucket's lifecycle rules
# hide backups/incr/ after 90 days and backups/full/ after 98, and delete hidden versions after a day.
clickhouse_b2_bucket: wyrd-clickhouse
clickhouse_b2_endpoint: https://s3.us-west-004.backblazeb2.com

# Xolotl's tables, loaded from NATS stream XOLOTL. No TTL: kept until decided otherwise.
clickhouse_xolotl: true

# ntfy (role ntfy), through the wyrd Cloudflare tunnel. Users: an admin, homelab and workspaces; their hashes and
# tokens are in OpenBao at homelab/ntfy. The tokens publish only to their own topic.
ntfy_base_url: https://ntfy.wyrd.team
ntfy_access:
  - homelab:homelab:wo
  - workspaces:workspaces:wo

# Trowel (role trowel), through the wyrd Cloudflare tunnel as https://hooks.wyrd.team. Wyrwood binding compose
# trowel/trowel, policy trowel (reads homelab/nats/trowel and homelab/trowel/github/*), access group 1503.
# Deck (role deck), on the homelab overlay as deck.internal:2222. Wyrwood binding compose deck/deck, policy deck
# (reads homelab/deck/host, homelab/nats/deck and deck/bots/*), access group 1504.
wyrwood_access_groups:
  - name: trowel
    gid: 1503
  - name: deck
    gid: 1504

# One GitHub webhook each, at https://hooks.wyrd.team/github/<name>, with its own secret.
trowel_github_orgs:
  - wyrd-company

# Deck's Discord bots. The token was stored by hand at deck/bots/WyrdBot (mount kv, namespace wyrwood).
deck_bots:
  - name: wyrdbot
    token: {path: deck/bots/WyrdBot, field: token}

# Deck's clients: one entry per workspace, from scripts/openbao/deck-client.fish, with its grants.
deck_keys: []
