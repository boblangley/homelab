---
workstation_owner: tinomen
workstation_homelab_interface: enp4s0
workstation_runner_address: 192.168.0.10
# The homelab workspace runs here and signs in as agent. It reaches this host's SSH through docker_gwbridge.
workstation_agent_interface: docker_gwbridge
# gtr6 hosted the boblangley-dev workspace, which held homelab-agent until it was decommissioned.
workstation_agent_retired_addresses:
  - 192.168.0.75
# This workstation's address on workstation_homelab_interface, the destination of its Swarm firewall rules.
workstation_address: 192.168.0.214
# The other Swarm nodes: docker-infra (manager) and the Docker workers. Each may reach this node's Swarm ports.
# `esp` also allows IPsec ESP, which the encrypted overlay carries; only the nodes that need it get it. The ingress
# manager on docker-infra pings this node's socket proxy over the overlay, and it restarts without ESP.
workstation_swarm_peers:
  - { address: 192.168.0.10, esp: true }  # docker-infra
  - { address: 192.168.0.75 }  # gtr6
  - { address: 192.168.0.65 }  # m1-1295
  - { address: 192.168.0.40 }  # rp4
  - { address: 192.168.0.50 }  # ser6-max
  - { address: 192.168.0.60 }  # ser6-p
  - { address: 192.168.0.45 }  # wtr-pro

# Reviewed AUR package revision for the Wyrwood version in group_vars/all.yml.
wyrwood_arch_aur_revision: ec73138d8bc23db3c919e1ae1bb62d2159454163
wyrwood_arch_pkgrel: 1
wyrwood_access_groups:
  - name: tinomen
    gid: 1000

menagerie_name: menagerie.tinomen-dev.internal
menagerie_operator_key: menagerie-tinomen-dev
menagerie_xolotl_provisioner_name: menagerie-tinomen-dev
# wyrd-automation stays first: the backup repository and template registered with no credential use the first App
# whose server holds their URL, and they are on wyrd-company.
menagerie_github_apps:
  - name: wyrd-automation
    id_key: wyrd_automation_app_id
    transit_key: gh-app-wyrd-automation
  - name: mmenm-automation
    id_key: mmenm_automation_app_id
    transit_key: gh-app-mmenm-automation
  - name: thelangleys-automation
    id_key: thelangleys_automation_app_id
    transit_key: gh-app-thelangleys-automation
