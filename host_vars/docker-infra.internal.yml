---
# Core infrastructure VM: Swarm manager, Arcane manager, ingress, identity, Wyrwood controller.
# uid 1000 is `core`, which owns the core services' data.

accounts_services:
  - name: core
    uid: 1000

wyrwood_access_groups:
  - name: homelab-runner
    gid: 1502

# Docker workers whose labels Caddy reads, through each one's socket proxy. Includes hosts not yet managed here.
edge_socket_proxies:
  - gtr6
  - ser6-p
  - ser6-max
  - m1-1295
  - wtr-pro
  - rp4
