---
- name: Check the APT collection scope
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Confirm the requested pattern matches the inventory
      ansible.builtin.assert:
        that:
          - query('ansible.builtin.inventory_hostnames', maintenance_apt_hosts | default('m1-1295.internal')) | length > 0
        fail_msg: The APT collection pattern matches no inventory hosts.

- name: Collect available APT updates
  hosts: "{{ maintenance_apt_hosts | default('m1-1295.internal') }}"
  gather_facts: false
  vars_files:
    - ../defaults.yml
  tasks:
    - name: Refresh the APT index
      become: true
      ansible.builtin.command:
        argv:
          - apt-get
          - -o
          - APT::Update::Error-Mode=any
          - update

    - name: Read available package updates
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/read-candidates.py') }}"
          - "{{ inventory_hostname }}"
      register: apt_candidates
      changed_when: false

    - name: Create the private snapshot directory
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ maintenance_state_dir }}/apt"
        state: directory
        mode: "0700"

    - name: Compare and save the snapshot
      delegate_to: localhost
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/save-snapshot.py"
          - "{{ maintenance_state_dir }}/apt"
        stdin: "{{ apt_candidates.stdout }}"
