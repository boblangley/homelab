# Applies deployment changes on the self-hosted runner.
# Automatic runs come from pushes to main that change deployment inputs. Operators can also run Apply by hand.
# Keep pull_request and pull_request_target off this workflow. A pull request from a fork must not run code on a
# runner that can reach every host.
name: Apply

on:
  push:
    branches: [main]
    # Add new repository inputs to site.yml or the Apply job here so changes to them trigger deployment.
    paths:
      - 'site.yml'
      - 'ansible.cfg'
      - 'known_hosts'
      - 'requirements.yml'
      - 'inventory/**'
      - 'group_vars/**'
      - 'host_vars/**'
      - 'roles/**'
  workflow_dispatch:
    inputs:
      preview:
        description: Preview only (--check --diff)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, homelab]
    env:
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      # Connects as `ansible`, and reads OpenBao through the runner's Wyrwood socket, which the runner exposes on
      # 127.0.0.1:8200. The runner play is skipped: recreating the runner would end this job.
      - name: Apply
        run: >-
          ansible-playbook site.yml --skip-tags runner
          -e ansible_user=ansible
          -e ansible_hashi_vault_url=http://127.0.0.1:8200
          -e ansible_hashi_vault_auth_method=none
          ${{ (github.event_name == 'workflow_dispatch' && inputs.preview) && '--check --diff' || '' }}
