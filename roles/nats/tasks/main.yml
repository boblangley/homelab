---
- name: Read the operator and account JWTs from OpenBao
  ansible.builtin.set_fact:
    nats_resolver: "{{ lookup('community.hashi_vault.vault_kv2_get', 'homelab/nats/server', engine_mount_point='kv').secret.resolver }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Read user admin's credentials from OpenBao
  ansible.builtin.set_fact:
    nats_admin_creds: "{{ lookup('community.hashi_vault.vault_kv2_get', 'homelab/nats/admin', engine_mount_point='kv').secret.creds }}"
  when: nats_streams | length > 0 or nats_consumers | length > 0
  delegate_to: localhost
  become: false
  no_log: true

- name: Create the project directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ nats_dir }}", owner: root, mode: "0755" }
    - { path: "{{ nats_dir }}/config", owner: root, mode: "0755" }
    - { path: "{{ nats_dir }}/tls", owner: root, mode: "0755" }
    - { path: "{{ nats_data }}", owner: "{{ nats_uid }}", mode: "0750" }
  register: nats_dirs

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ nats_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

# No diff: the version before operator mode had the password users' bcrypt hashes, and a diff shows the old file.
- name: Write the server config
  ansible.builtin.template:
    src: nats.conf.j2
    dest: "{{ nats_dir }}/config/nats.conf"
    owner: "{{ nats_uid }}"
    group: "{{ nats_uid }}"
    mode: "0400"
  diff: false
  notify: Reload NATS

# A change of operator or system account needs a restart; NATS refuses to reload one.
- name: Write the operator and account JWTs
  ansible.builtin.copy:
    content: "{{ nats_resolver }}"
    dest: "{{ nats_dir }}/config/resolver.conf"
    owner: "{{ nats_uid }}"
    group: "{{ nats_uid }}"
    mode: "0400"
  no_log: true
  diff: false
  notify: Restart NATS

- name: Remove the config from its old place
  ansible.builtin.file:
    path: "{{ nats_dir }}/nats.conf"
    state: absent

- name: Keep the TLS certificate current
  ansible.builtin.include_role:
    name: service_cert
  vars:
    service_cert_dir: "{{ nats_dir }}/tls"
    service_cert_name: "{{ nats_name }}"
    service_cert_owner: "{{ nats_uid }}"

- name: Reload NATS for a new certificate
  ansible.builtin.debug:
    msg: New certificate for {{ nats_name }}
  changed_when: true
  when: service_cert_renewed
  notify: Reload NATS

- name: Start the project
  community.docker.docker_compose_v2:
    project_src: "{{ nats_dir }}"
    state: present
  register: nats_start
  # A preview has only pretended to create the project directory on a first run.
  when: not (ansible_check_mode and nats_dirs is changed)

# For the stream and consumer script, which runs the NATS CLI as admin.
- name: Write user admin's credentials
  ansible.builtin.copy:
    content: "{{ nats_admin_creds }}"
    dest: "{{ nats_dir }}/admin.creds"
    owner: root
    group: root
    mode: "0400"
  when: nats_admin_creds is defined
  no_log: true
  diff: false

- name: Remove user admin's old nkey seed
  ansible.builtin.file:
    path: "{{ nats_dir }}/admin.nk"
    state: absent

- name: Write the stream and consumer script
  ansible.builtin.template:
    src: jetstream.py.j2
    dest: "{{ nats_dir }}/jetstream"
    owner: root
    group: root
    mode: "0755"
  register: nats_jetstream_script

# Streams need the server's new config, such as a larger max_payload.
- name: Reload or restart NATS now if its config changed
  ansible.builtin.meta: flush_handlers

# A preview runs it with --check, which only reports.
- name: Create and update the streams and consumers
  ansible.builtin.command: "{{ nats_dir }}/jetstream{{ ' --check' if ansible_check_mode else '' }}"
  register: nats_jetstream
  changed_when: nats_jetstream.stdout | length > 0
  check_mode: false
  when:
    - nats_streams | length > 0 or nats_consumers | length > 0
    # A preview can't run a script it has only pretended to write.
    - not (ansible_check_mode and (nats_dirs is changed or nats_jetstream_script is changed))
