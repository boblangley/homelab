---
# Package from the Wyrd Company apt repository, which the base role adds.
- name: Check for the Wyrd Company apt repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/wyrd-company.sources
  register: wyrwood_repo

# A preview can't install from a repository the base role has only pretended to add.
- name: Install the Wyrwood agent
  ansible.builtin.apt:
    name: "wyrwood={{ wyrwood_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: wyrwood_repo.stat.exists or not ansible_check_mode

# The agent runs only once the controller has approved it. Until then, `login` (which reuses the agent's key) asks the
# controller again: it exits 0 once an operator has approved the agent in the Wyrwood UI, and 5 while that is pending.
- name: Check whether the agent is running
  ansible.builtin.command: systemctl is-active wyrwood-agent
  register: wyrwood_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Log in to the controller
  ansible.builtin.command: >-
    wyrwood agent login {{ wyrwood_controller }}
    --accept-fingerprint {{ wyrwood_controller_fingerprint }}
    --output json
  register: wyrwood_login
  changed_when: wyrwood_login.rc == 0
  failed_when: wyrwood_login.rc not in [0, 5]
  when: wyrwood_active.stdout != 'active' and not ansible_check_mode

- name: Report that approval is pending
  ansible.builtin.debug:
    msg:
      - "Approve {{ inventory_hostname_short }} in the Wyrwood UI, comparing its agent fingerprint, then run the playbook again."
      - "{{ wyrwood_login.stdout | from_json }}"
  when: wyrwood_login.rc | default(0) == 5

- name: Start the agent at boot
  ansible.builtin.systemd_service:
    name: wyrwood-agent
    enabled: true
    state: started
  when: wyrwood_active.stdout == 'active' or wyrwood_login.rc | default(1) == 0
