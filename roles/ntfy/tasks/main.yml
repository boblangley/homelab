---
- name: Create the project directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ntfy_dir }}", owner: root, mode: "0755" }
    - { path: "{{ ntfy_dir }}/scripts", owner: root, mode: "0755" }
    - { path: "{{ ntfy_data }}", owner: "{{ ntfy_uid }}", mode: "0750" }
  register: ntfy_dirs

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ ntfy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write the scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ntfy_dir }}/scripts/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - fetch-secrets.sh
    - start-ntfy.sh
  notify: Restart ntfy

# The sidecar needs its Wyrwood binding first: without its socket directory, Docker refuses to start it.
- name: Start the project
  community.docker.docker_compose_v2:
    project_src: "{{ ntfy_dir }}"
    state: present
  register: ntfy_start
  # A preview has only pretended to create the project directory on a first run.
  when: not (ansible_check_mode and ntfy_dirs is changed)
