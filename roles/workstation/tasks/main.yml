---
- name: Keep the runner key authorized for workstation deployments
  ansible.posix.authorized_key:
    user: ansible
    key: "{{ lookup('ansible.builtin.file', role_path ~ '/../accounts/files/ansible.pub') }}"
    key_options: 'restrict,from="{{ workstation_runner_address }}"'
    exclusive: true

- name: Keep the runner's passwordless sudo access
  ansible.builtin.copy:
    content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/ansible
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Allow HomeLab automation SSH connections
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ workstation_homelab_interface }}"
    proto: tcp
    from_ip: "{{ item.address }}"
    to_port: "22"
    comment: "{{ item.comment }}"
  loop:
    - address: "{{ workstation_runner_address }}"
      comment: HomeLab Actions runner

# The operator workspace runs on this host, on the homelab overlay. It reaches the host's own SSH through
# docker_gwbridge, from an address Docker assigns, so the rule names the interface rather than a source.
- name: Allow SSH from the operator workspace on this host
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ workstation_agent_interface }}"
    proto: tcp
    to_port: "22"
    comment: HomeLab operator workspace
  when: workstation_agent_interface is defined

# ufw keeps a rule until it is deleted. These are operator workspace hosts that no longer hold one.
- name: Remove SSH rules for retired operator workspace hosts
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ workstation_homelab_interface }}"
    proto: tcp
    from_ip: "{{ item }}"
    to_port: "22"
    delete: true
  loop: "{{ workstation_agent_retired_addresses | default([]) }}"

# A Swarm node needs 7946 (discovery) and 4789/udp (VXLAN overlay) from each other node.
- name: Allow Swarm discovery from the other nodes
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ workstation_homelab_interface }}"
    proto: "{{ item.1 }}"
    from_ip: "{{ item.0.address }}"
    to_ip: "{{ workstation_address }}"
    to_port: "7946"
    comment: HomeLab Swarm discovery
  loop: "{{ workstation_swarm_peers | product(['tcp', 'udp']) | list }}"
  loop_control:
    label: "{{ item.0.address }}/{{ item.1 }}"

- name: Allow the Swarm overlay from the other nodes
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ workstation_homelab_interface }}"
    proto: udp
    from_ip: "{{ item.address }}"
    to_ip: "{{ workstation_address }}"
    to_port: "4789"
    comment: HomeLab Swarm overlay
  loop: "{{ workstation_swarm_peers }}"
  loop_control:
    label: "{{ item.address }}"

# The encrypted overlay's traffic is IPsec ESP (IP protocol 50), which has no ports.
- name: Allow the encrypted Swarm overlay from the nodes that need it
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ workstation_homelab_interface }}"
    proto: esp
    from_ip: "{{ item.address }}"
    to_ip: "{{ workstation_address }}"
    comment: Homelab Swarm encrypted overlay
  loop: "{{ workstation_swarm_peers | selectattr('esp', 'defined') | selectattr('esp') | list }}"
  loop_control:
    label: "{{ item.address }}"

- name: Keep the workstation Menagerie socket directory private
  ansible.builtin.file:
    path: /var/lib/menagerie-sockets
    state: directory
    owner: "{{ workstation_owner }}"
    group: "{{ workstation_owner }}"
    mode: "0700"
