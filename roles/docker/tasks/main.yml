---
# Docker's own packages, as on the other workers. Key fingerprint 9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88.
- name: Install the Docker apt signing key
  ansible.builtin.copy:
    src: docker.asc
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache

- name: Add the Docker apt repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Architectures: {{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache
  register: docker_repo

- name: Update the apt cache for a new repository
  ansible.builtin.meta: flush_handlers

# A preview can't install from a repository it has only pretended to add.
- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  when: not (ansible_check_mode and docker_repo is changed)

- name: Start Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not (ansible_check_mode and docker_repo is changed)

- name: Join the Swarm
  ansible.builtin.import_tasks: swarm.yml
