---
# Compose project `clickhouse`: a single ClickHouse server for Xolotl's request data (from NATS) and OpenTelemetry.
# Only containers reach it, on the homelab overlay as clickhouse.internal; the host publishes no ports. Plaintext
# ports are off: native protocol over TLS on 9440, HTTPS on 8443.
#
# TLS: a certificate from OpenBao, kept current by role service_cert.
#
# Users, their grants and settings profiles are declared here (clickhouse_users); each password is in OpenBao at
# homelab/clickhouse/<user>, field password. The server gets only SHA-256 hashes, in a root-only file.
clickhouse_dir: /opt/docker/clickhouse
clickhouse_data: /srv/clickhouse
clickhouse_version: 26.8.37.168

# The server runs as this uid, which owns its data and key.
clickhouse_uid: 1000

clickhouse_name: clickhouse.internal

# Share of host memory the server may use. Raise it once wtr-pro has more RAM.
clickhouse_memory_ratio: 0.5

# name, profile (default or readonly), and either grants (GRANT statements, without the TO clause) or
# access_management: true. ClickHouse rejects a user with both; one with access_management has full access and manages
# users and grants with SQL.
clickhouse_users: []

# Days each kind of OpenTelemetry data is kept: traces, logs, metrics. 0 or missing: kept forever. The gateway's
# exporters create the tables with these TTLs; this role changes the TTL of a table that already exists.
clickhouse_otel_retention: "{{ otel_retention_days | default({}) }}"

# The OTel tables, from the v0.165 exporter's schema: signal: {table: the column its TTL uses}.
clickhouse_otel_tables:
  traces:
    otel_traces: Timestamp
    otel_traces_trace_id_ts: Start
  logs:
    otel_logs: Timestamp
  metrics:
    otel_metrics_gauge: TimeUnix
    otel_metrics_sum: TimeUnix
    otel_metrics_histogram: TimeUnix
    otel_metrics_exponential_histogram: TimeUnix
    otel_metrics_summary: TimeUnix

# B2 (S3 API) for the daily archive and backups. Empty bucket: neither runs. The key is in OpenBao at
# homelab/b2/clickhouse, fields key_id and application_key.
clickhouse_b2_bucket: ""
clickhouse_b2_endpoint: ""

# When they run (systemd OnCalendar, host time).
clickhouse_archive_at: "*-*-* 01:30"
clickhouse_backup_at: "*-*-* 02:30"
