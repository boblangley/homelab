---
- name: Read the user passwords from OpenBao
  ansible.builtin.set_fact:
    clickhouse_passwords: >-
      {{ clickhouse_passwords | default({}) | combine({item.name: lookup('community.hashi_vault.vault_kv2_get',
      'homelab/clickhouse/' ~ item.name, engine_mount_point='kv').secret.password}) }}
  loop: "{{ clickhouse_users | rejectattr('ssh_public_key', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  no_log: true

# Directories, not single files, are mounted: Ansible replaces a file with a new one, and a container keeps seeing the
# old file. ClickHouse rereads users.d and the certificate when they change.
- name: Read the B2 key from OpenBao
  ansible.builtin.set_fact:
    clickhouse_b2_key: "{{ lookup('community.hashi_vault.vault_kv2_get', 'homelab/b2/clickhouse', engine_mount_point='kv').secret }}"
  when: clickhouse_b2_bucket | length > 0
  delegate_to: localhost
  become: false
  no_log: true

- name: Read NATS user clickhouse's credentials from OpenBao
  ansible.builtin.set_fact:
    clickhouse_nats_creds: "{{ lookup('community.hashi_vault.vault_kv2_get', 'homelab/nats/clickhouse', engine_mount_point='kv').secret.creds }}"
  when: clickhouse_xolotl
  delegate_to: localhost
  become: false
  no_log: true

- name: Read the ClickHouse SSH host key from OpenBao
  ansible.builtin.set_fact:
    clickhouse_ssh_host_key: "{{ lookup('community.hashi_vault.vault_kv2_get', 'homelab/clickhouse/ssh-host', engine_mount_point='kv').secret.private_key }}"
  when: clickhouse_ssh_enabled
  delegate_to: localhost
  become: false
  no_log: true

- name: Create the project directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ clickhouse_dir }}", owner: root, mode: "0755" }
    - { path: "{{ clickhouse_dir }}/config.d", owner: root, mode: "0755" }
    - { path: "{{ clickhouse_dir }}/users.d", owner: root, mode: "0755" }
    - { path: "{{ clickhouse_dir }}/tls", owner: root, mode: "0755" }
    - { path: "{{ clickhouse_dir }}/bin", owner: root, mode: "0755" }
    - { path: "{{ clickhouse_dir }}/nats", owner: root, mode: "0755" }
    - { path: "{{ clickhouse_data }}", owner: "{{ clickhouse_uid }}", mode: "0750" }
  register: clickhouse_dirs

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ clickhouse_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write the ClickHouse SSH host key
  ansible.builtin.copy:
    content: "{{ clickhouse_ssh_host_key }}"
    dest: "{{ clickhouse_dir }}/config.d/ssh_host_ed25519_key"
    owner: "{{ clickhouse_uid }}"
    group: "{{ clickhouse_uid }}"
    mode: "0400"
  when: clickhouse_ssh_enabled
  no_log: true
  diff: false
  notify: Restart ClickHouse

# Ports and memory settings need a restart.
- name: Write the server config
  ansible.builtin.template:
    src: config.xml.j2
    dest: "{{ clickhouse_dir }}/config.d/homelab.xml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ClickHouse

# Password hashes: readable only by the server's uid. Never shown in a diff.
- name: Write the users
  ansible.builtin.template:
    src: users.xml.j2
    dest: "{{ clickhouse_dir }}/users.d/homelab.xml"
    owner: "{{ clickhouse_uid }}"
    group: "{{ clickhouse_uid }}"
    mode: "0400"
  no_log: true
  diff: false

# The B2 key: readable only by the server's uid. Never shown in a diff.
- name: Write the B2 connection
  ansible.builtin.template:
    src: b2.xml.j2
    dest: "{{ clickhouse_dir }}/config.d/b2.xml"
    owner: "{{ clickhouse_uid }}"
    group: "{{ clickhouse_uid }}"
    mode: "0400"
  when: clickhouse_b2_bucket | length > 0
  no_log: true
  diff: false
  notify: Restart ClickHouse

# The NATS engine's login: a .creds file, readable only by the server's uid, named in config.d/nats.xml.
- name: Write the NATS credentials
  ansible.builtin.copy:
    content: "{{ clickhouse_nats_creds }}"
    dest: "{{ clickhouse_dir }}/nats/clickhouse.creds"
    owner: "{{ clickhouse_uid }}"
    group: "{{ clickhouse_uid }}"
    mode: "0400"
  when: clickhouse_xolotl
  no_log: true
  diff: false
  notify: Restart ClickHouse

# No diff: the version before the .creds file had the NATS password, and a diff shows the old file.
- name: Write the NATS login
  ansible.builtin.template:
    src: nats.xml.j2
    dest: "{{ clickhouse_dir }}/config.d/nats.xml"
    owner: root
    group: root
    mode: "0644"
  when: clickhouse_xolotl
  diff: false
  notify: Restart ClickHouse

- name: Write Xolotl's schema
  ansible.builtin.template:
    src: xolotl.sql.j2
    dest: "{{ clickhouse_dir }}/xolotl.sql"
    owner: root
    group: root
    mode: "0644"
  when: clickhouse_xolotl

- name: Keep the TLS certificate current
  ansible.builtin.include_role:
    name: service_cert
  vars:
    service_cert_dir: "{{ clickhouse_dir }}/tls"
    service_cert_name: "{{ clickhouse_name }}"
    service_cert_owner: "{{ clickhouse_uid }}"

- name: Start the project
  community.docker.docker_compose_v2:
    project_src: "{{ clickhouse_dir }}"
    state: present
    wait: true
  register: clickhouse_start
  # A preview has only pretended to create the project directory on a first run.
  when: not (ansible_check_mode and clickhouse_dirs is changed)

- name: Write the maintenance script
  ansible.builtin.template:
    src: maintenance.sh.j2
    dest: "{{ clickhouse_dir }}/bin/maintenance"
    owner: root
    group: root
    mode: "0755"
  register: clickhouse_script

# The retention step needs the server up, after any restart the config needs.
- name: Restart ClickHouse now if its config changed
  ansible.builtin.meta: flush_handlers

# A preview runs it with --check, which only reports.
- name: Set the OTel retention
  ansible.builtin.command: "{{ clickhouse_dir }}/bin/maintenance retention{{ ' --check' if ansible_check_mode else '' }}"
  register: clickhouse_retention
  changed_when: clickhouse_retention.stdout | length > 0
  check_mode: false
  # A preview can't run a script it has only pretended to write.
  when: not (ansible_check_mode and (clickhouse_dirs is changed or clickhouse_script is changed))

- name: Check Xolotl's tables
  ansible.builtin.shell: >-
    docker exec -e CLICKHOUSE_PASSWORD clickhouse clickhouse-client --secure --host 127.0.0.1 --port 9440
    --accept-invalid-certificate --user admin
    --query "SELECT count() FROM system.tables WHERE database = 'xolotl'
    AND name IN ('exchanges', 'exchanges_queue', 'exchanges_mv', 'exchanges_errors', 'exchanges_errors_mv')"
  environment:
    CLICKHOUSE_PASSWORD: "{{ clickhouse_passwords.admin }}"
  register: clickhouse_xolotl_tables
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - clickhouse_xolotl
    - not (ansible_check_mode and clickhouse_dirs is changed)

# The queue table connects to NATS when it's created, so the stream and consumer must exist (role nats, earlier).
- name: Create Xolotl's tables
  ansible.builtin.shell: >-
    docker exec -i -e CLICKHOUSE_PASSWORD clickhouse clickhouse-client --secure --host 127.0.0.1 --port 9440
    --accept-invalid-certificate --user admin --multiquery < {{ clickhouse_dir }}/xolotl.sql
  environment:
    CLICKHOUSE_PASSWORD: "{{ clickhouse_passwords.admin }}"
  changed_when: true
  no_log: true
  when:
    - clickhouse_xolotl
    - clickhouse_xolotl_tables is not skipped
    - clickhouse_xolotl_tables.stdout | int < 5

- name: Write the archive and backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - clickhouse-archive.service
    - clickhouse-archive.timer
    - clickhouse-backup.service
    - clickhouse-backup.timer
  when: clickhouse_b2_bucket | length > 0
  register: clickhouse_units

- name: Enable the archive and backup timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: "{{ clickhouse_units is changed }}"
  loop:
    - clickhouse-archive.timer
    - clickhouse-backup.timer
  when:
    - clickhouse_b2_bucket | length > 0
    # A preview can't enable units it has only pretended to write.
    - not (ansible_check_mode and clickhouse_units is changed)
