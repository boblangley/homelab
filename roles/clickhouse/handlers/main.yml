---
# Not when the start step just created or recreated the container, nor in a preview of the first run.
- name: Restart ClickHouse
  community.docker.docker_compose_v2:
    project_src: "{{ clickhouse_dir }}"
    state: restarted
  when:
    - clickhouse_start is not changed
    - not (ansible_check_mode and clickhouse_dirs is changed)
