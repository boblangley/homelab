---
- name: Read ClickHouse user otel's password from OpenBao
  ansible.builtin.set_fact:
    otel_gateway_password: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'homelab/clickhouse/otel', engine_mount_point='kv').secret.password }}
  delegate_to: localhost
  become: false
  no_log: true

- name: Create the project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ otel_gateway_dir }}"
    - "{{ otel_gateway_dir }}/config"
    - "{{ otel_gateway_dir }}/tls"
  register: otel_gateway_dirs

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ otel_gateway_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write the ClickHouse password
  ansible.builtin.copy:
    content: "CLICKHOUSE_PASSWORD={{ otel_gateway_password }}\n"
    dest: "{{ otel_gateway_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart the OTel gateway

- name: Write the collector config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ otel_gateway_dir }}/config/config.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the OTel gateway

# The collector rereads it daily (reload_interval).
- name: Keep the TLS certificate current
  ansible.builtin.include_role:
    name: service_cert
  vars:
    service_cert_dir: "{{ otel_gateway_dir }}/tls"
    service_cert_name: "{{ otel_gateway_name }}"
    service_cert_owner: "{{ otel_gateway_uid }}"

- name: Start the project
  community.docker.docker_compose_v2:
    project_src: "{{ otel_gateway_dir }}"
    state: present
  register: otel_gateway_start
  # A preview has only pretended to create the project directory on a first run.
  when: not (ansible_check_mode and otel_gateway_dirs is changed)
