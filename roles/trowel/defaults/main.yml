---
# Compose project `trowel`: Trowel, the webhook relay. It takes webhooks on the homelab overlay as
# trowel.internal:8080 (the wyrd Cloudflare tunnel routes the public hostname to it; the route is set in the
# Cloudflare dashboard) and publishes each to NATS JetStream. The host publishes no ports.
#
# Secrets come through its Wyrwood binding (compose trowel/trowel, directory trowel): Trowel reads its NATS .creds
# (homelab/nats/trowel, field creds) and each webhook's secret from OpenBao through vault.sock, at startup and on
# reload. Nothing secret is in its environment or on disk. The streams its webhooks publish to are role nats's.
trowel_dir: /opt/docker/trowel
trowel_version: 0.3.0
trowel_name: trowel.internal
trowel_container: trowel
trowel_wyrwood_dir: "/run/wyrwood/containers/{{ trowel_container }}"

# The binding's access group: the image runs as uid 100, which reaches the sockets through it. The wyrwood_agent role
# creates the group and adds the agent to it.
trowel_socket_gid: 1503

# GitHub organizations or accounts, each with its own webhook at /github/<name> and its own secret in OpenBao at
# homelab/trowel/github/<name>, field webhook_secret, so one owner's secret is never another's. Each publishes
# github.<owner>.<repo>.<event>.<action>: broad to specific, so a consumer selects with wildcards (one repo:
# github.<owner>.<repo>.>; every PR: github.*.*.pull_request.>). A token the event lacks (the repo of an org event,
# the action of a push) is `none`, and a `.` in a value becomes `_dot_`. The transform adds the three tokens as headers
# X-Github-Owner, X-Github-Repo and X-Github-Action, beside GitHub's own. Bodies up to NATS's 8 MiB max_payload;
# de-duplicated by GitHub's delivery ID.
trowel_github_orgs: []

trowel_github_transform: |-
  (
    $token := function($s) { $exists($s) and $s != "" ? $replace($string($s), ".", "_dot_") : "none" };
    $owner := payload.repository.owner.login ? payload.repository.owner.login
      : payload.organization.login ? payload.organization.login
      : payload.installation.account.login;
    $merge([headers, {
      "X-Github-Owner": $token($owner),
      "X-Github-Repo": $token(payload.repository.name),
      "X-Github-Action": $token(payload.action)
    }])
  )

# Other webhooks, as in Trowel's configuration (path, subject, verify, ...). Secrets as *_vault references, with paths
# in mount kv.
trowel_webhooks: []
