---
# OpenBao, read on the controller by community.hashi_vault lookups. Homelab data is in the `wyrwood` namespace,
# where Wyrwood bindings (such as the Actions runner's) can also reach it.
# These suit a workstation: VAULT_TOKEN, or ~/.vault-token after `bao login`. The Apply workflow overrides the URL and
# auth method to use the runner's Wyrwood socket, which adds the binding's token itself.
ansible_hashi_vault_url: https://openbao.internal:8200
ansible_hashi_vault_auth_method: token
ansible_hashi_vault_namespace: wyrwood
ansible_hashi_vault_ca_cert: /etc/ssl/certs/ca-certificates.crt

# Wyrwood: the controller (role wyrd) and every agent (role wyrwood_agent) run the same version.
wyrwood_version: 0.7.0

# Arcane: the manager (role arcane) and every agent (role docker_agent) run the same version. Upgrade them together;
# v3 renamed the agent's environment variables.
arcane_version: v2.17.3

# OpenTelemetry: the gateway (role otel_gateway) and the per-host agents (role otel_agent) run the same collector.
otel_collector_version: 0.165.0
