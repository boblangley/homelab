---
- name: Base configuration
  hosts: managed
  become: true
  roles:
    - base

- name: Docker
  hosts: docker:&managed
  become: true
  roles:
    - docker

- name: Docker agent project
  hosts: docker_workers:&managed
  become: true
  roles:
    - docker_agent

- name: Wyrwood agent
  hosts: wyrwood_agents:&managed
  become: true
  roles:
    - wyrwood_agent

- name: Network edge
  hosts: edge:&managed
  become: true
  roles:
    - edge

- name: Identity provider
  hosts: identity:&managed
  become: true
  roles:
    - identity

- name: Arcane manager
  hosts: arcane:&managed
  become: true
  roles:
    - arcane

- name: Wyrwood controller and Xolotl
  hosts: wyrd:&managed
  become: true
  roles:
    - wyrd

- name: NATS
  hosts: nats:&managed
  become: true
  roles:
    - nats

- name: ClickHouse
  hosts: clickhouse:&managed
  become: true
  roles:
    - clickhouse

- name: OpenTelemetry gateway
  hosts: otel_gateway:&managed
  become: true
  roles:
    - otel_gateway

- name: Grafana
  hosts: grafana:&managed
  become: true
  roles:
    - grafana

- name: ntfy
  hosts: ntfy:&managed
  become: true
  roles:
    - ntfy

- name: Trowel
  hosts: trowel:&managed
  become: true
  roles:
    - trowel

- name: Deck
  hosts: deck:&managed
  become: true
  roles:
    - deck

# After the gateway, which the agents send to.
- name: OpenTelemetry agent
  hosts: docker:&managed
  become: true
  roles:
    - otel_agent

- name: PostgreSQL
  hosts: postgres:&managed
  become: true
  roles:
    - postgres

- name: Menagerie
  hosts: menagerie:&managed
  become: true
  roles:
    - menagerie

- name: CachyOS workstations
  hosts: workstations
  remote_user: ansible
  become: true
  pre_tasks:
    - name: Check the workstation package manager
      ansible.builtin.assert:
        that: ansible_facts.pkg_mgr == 'pacman'

    - name: Check for initial Wyrwood enrollment
      ansible.builtin.stat:
        path: /var/lib/wyrwood/controller.json
      register: workstation_wyrwood_enrollment

    - name: Require workstation bootstrap before deployment
      ansible.builtin.assert:
        that: workstation_wyrwood_enrollment.stat.exists
        fail_msg: Complete the local Swarm and Menagerie bootstrap before applying this play.

  tasks:
    - name: Configure the workstation deployment account and directories
      ansible.builtin.import_role:
        name: workstation

    - name: Configure the workstation operator account
      ansible.builtin.import_role:
        name: accounts
        tasks_from: automation
      vars:
        accounts_automation:
          - "{{ accounts_agent }}"

    - name: Update the workstation Wyrwood agent
      ansible.builtin.import_role:
        name: wyrwood_agent
        tasks_from: arch

    - name: Wait for Menagerie's credential socket
      ansible.builtin.wait_for:
        path: /run/wyrwood/containers/menagerie/vault.sock
        timeout: 30
      when: not ansible_check_mode

    - name: Deploy Menagerie on the workstation
      ansible.builtin.import_role:
        name: menagerie

    - name: Deploy the Arcane agent and Docker socket proxy on the workstation
      ansible.builtin.import_role:
        name: docker_agent

# Tagged so the runner can skip itself; apply it from a workstation.
- name: Actions runner
  hosts: runners:&managed
  become: true
  tags: runner
  roles:
    - runner

# After Docker, so people get the docker group on the same run.
- name: Accounts
  hosts: managed
  become: true
  roles:
    - accounts
