---
- name: Base configuration
  hosts: managed
  become: true
  roles:
    - base

- name: Docker
  hosts: docker:&managed
  become: true
  roles:
    - docker

- name: Docker agent project
  hosts: docker_workers:&managed
  become: true
  roles:
    - docker_agent

- name: Wyrwood agent
  hosts: wyrwood_agents:&managed
  become: true
  roles:
    - wyrwood_agent

- name: Network edge
  hosts: edge:&managed
  become: true
  roles:
    - edge

- name: Identity provider
  hosts: identity:&managed
  become: true
  roles:
    - identity

- name: Arcane manager
  hosts: arcane:&managed
  become: true
  roles:
    - arcane

- name: Wyrwood controller and Xolotl
  hosts: wyrd:&managed
  become: true
  roles:
    - wyrd

- name: NATS
  hosts: nats:&managed
  become: true
  roles:
    - nats

- name: ClickHouse
  hosts: clickhouse:&managed
  become: true
  roles:
    - clickhouse

- name: OpenTelemetry gateway
  hosts: otel_gateway:&managed
  become: true
  roles:
    - otel_gateway

- name: PostgreSQL
  hosts: postgres:&managed
  become: true
  roles:
    - postgres

- name: Menagerie
  hosts: menagerie:&managed
  become: true
  roles:
    - menagerie

# Tagged so the runner can skip itself; apply it from a workstation.
- name: Actions runner
  hosts: runners:&managed
  become: true
  tags: runner
  roles:
    - runner

# After Docker, so people get the docker group on the same run.
- name: Accounts
  hosts: managed
  become: true
  roles:
    - accounts
