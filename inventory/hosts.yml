---
# Hosts managed by this repo. Ansible connects as `agent` (uid 1500), which has passwordless sudo.
all:
  vars:
    ansible_user: agent
  children:
    managed:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
    docker:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
    # Swarm workers run the docker-agent project (Arcane agent and socket proxy). docker-infra is the Swarm manager
    # and runs the Arcane manager instead.
    docker_workers:
      hosts:
        wtr-pro.internal:
    wyrwood_agents:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
