---
# Hosts managed by this repo. Ansible connects as `agent` (uid 1500) from a workstation; the Apply workflow connects
# as `ansible` (uid 1501). Both have passwordless sudo.
all:
  vars:
    ansible_user: agent
  children:
    managed:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
        ser6-p.internal:
        ser6-max.internal:
        m1-1295.internal:
        gtr6.internal:
        rp4.internal:
    # Workstations use the Swarm overlay for local Compose workloads and are outside the managed host plays.
    workstations:
      hosts:
        tinomen-dev.internal:
    docker:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
        ser6-p.internal:
        ser6-max.internal:
        m1-1295.internal:
        gtr6.internal:
        rp4.internal:
    # Swarm workers run the docker-agent project (Arcane agent and socket proxy). docker-infra is the Swarm manager
    # and runs the Arcane manager instead.
    docker_workers:
      hosts:
        wtr-pro.internal:
        ser6-p.internal:
        ser6-max.internal:
        m1-1295.internal:
        gtr6.internal:
        rp4.internal:
    wyrwood_agents:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
        ser6-p.internal:
        ser6-max.internal:
        m1-1295.internal:
        gtr6.internal:
        rp4.internal:
    runners:
      hosts:
        docker-infra.internal:
    wyrd:
      hosts:
        docker-infra.internal:
    edge:
      hosts:
        docker-infra.internal:
    identity:
      hosts:
        docker-infra.internal:
    arcane:
      hosts:
        docker-infra.internal:
    nats:
      hosts:
        wtr-pro.internal:
    clickhouse:
      hosts:
        wtr-pro.internal:
    otel_gateway:
      hosts:
        wtr-pro.internal:
    grafana:
      hosts:
        wtr-pro.internal:
    ntfy:
      hosts:
        wtr-pro.internal:
    trowel:
      hosts:
        wtr-pro.internal:
    deck:
      hosts:
        wtr-pro.internal:
    postgres:
      hosts:
        ser6-max.internal:
    menagerie:
      hosts:
        gtr6.internal:
