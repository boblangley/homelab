---
# Hosts managed by this repo. Ansible connects as `agent` (uid 1500) from a workstation; the Apply workflow connects
# as `ansible` (uid 1501). Both have passwordless sudo.
all:
  vars:
    ansible_user: agent
  children:
    managed:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
    docker:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
    # Swarm workers run the docker-agent project (Arcane agent and socket proxy). docker-infra is the Swarm manager
    # and runs the Arcane manager instead.
    docker_workers:
      hosts:
        wtr-pro.internal:
    wyrwood_agents:
      hosts:
        docker-infra.internal:
        wtr-pro.internal:
    runners:
      hosts:
        docker-infra.internal:
    wyrd:
      hosts:
        docker-infra.internal:
    edge:
      hosts:
        docker-infra.internal:
    identity:
      hosts:
        docker-infra.internal:
