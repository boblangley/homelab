---
# Hosts managed by this repo. Ansible connects as `agent` (uid 1500), which has passwordless sudo.
all:
  vars:
    ansible_user: agent
  children:
    managed:
      hosts:
        wtr-pro.internal:
    docker:
      hosts:
        wtr-pro.internal:
    # Not managed yet. Listed so roles can delegate to it, for example to read the Swarm join token.
    swarm_manager:
      hosts:
        docker-infra.internal:
